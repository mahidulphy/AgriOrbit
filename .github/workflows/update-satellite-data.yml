name: Update Satellite Data Cache

on:
  schedule:
    # Runs daily at 01:00 UTC (07:00 AM Bangladesh Standard Time)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      district:
        description: 'District to update for the legacy satellite snapshot (leave empty for all 64)'
        required: false
        default: ''
      skip_smap:
        description: 'Skip SMAP soil moisture extraction'
        type: boolean
        default: false
      skip_ndvi:
        description: 'Skip MODIS/VIIRS NDVI extraction'
        type: boolean
        default: false
      skip_grace:
        description: 'Skip GRACE mascon refresh (normally refreshed when cache is older than 20 days)'
        type: boolean
        default: false
      skip_appeears:
        description: 'Skip AppEEARS bundle download and ECOSTRESS/MODIS processing'
        type: boolean
        default: false
      run_nasadem:
        description: 'Rebuild NASADEM elevation/slope cache from LP DAAC tiles (slow, ~700 MB)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-satellite:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: 1. Legacy satellite snapshot (MODIS/VIIRS & SMAP)
        continue-on-error: true
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.district }}" ]; then
            ARGS="$ARGS --district ${{ github.event.inputs.district }}"
          fi
          if [ "${{ github.event.inputs.skip_smap }}" = "true" ]; then
            ARGS="$ARGS --skip-smap"
          fi
          if [ "${{ github.event.inputs.skip_ndvi }}" = "true" ]; then
            ARGS="$ARGS --skip-ndvi"
          fi
          npx tsx scripts/update-satellite-data.ts $ARGS

      - name: 2. Refresh 64-District NASA POWER cache
        continue-on-error: true
        run: |
          echo "Refreshing 64-district NASA POWER agrometeorology cache..."
          npx tsx scripts/fetch-cache.ts --all

      - name: 3. Ingest GPM IMERG daily precipitation (last 30 days)
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python scripts/ingest_gpm.py

      - name: 4. Ingest GRACE mascon total water storage (monthly cadence)
        if: github.event.inputs.skip_grace != 'true'
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          if [ ! -f public/cache/grace/grace_summary.json ] || [ -n "$(find public/cache/grace/grace_summary.json -mtime +20)" ]; then
            echo "GRACE cache missing or older than 20 days; refreshing."
            python scripts/ingest_grace.py
          else
            echo "GRACE cache is fresh (<20 days); skipping."
          fi

      - name: 5. Download completed AppEEARS bundles
        if: github.event.inputs.skip_appeears != 'true'
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python scripts/download_appeears.py ecostress mod13q1 myd13q1

      - name: 6. Process ECOSTRESS and MODIS NDVI bundles
        if: github.event.inputs.skip_appeears != 'true'
        run: python scripts/process_appeears.py

      - name: 7. Rebuild NASADEM elevation/slope cache (manual only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_nasadem == 'true'
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python scripts/fetch_nasadem.py
          python scripts/process_nasadem.py

      - name: 8. Summarize cache outputs
        if: success()
        run: |
          echo "Cache file counts:"
          for dir in gpm grace nasadem ecostress modis_ndvi; do
            if [ -d "public/cache/$dir" ]; then
              echo "  public/cache/$dir: $(find public/cache/$dir -type f | wc -l) files"
            fi
          done

      - name: 9. Commit and push updated satellite caches
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/satellite.json src/data/fallback-rangpur.json public/cache
          if [ -n "$(git status --porcelain src/data/ public/cache/)" ]; then
            git commit -m "chore(satellite): refresh GPM/GRACE/ECOSTRESS/MODIS caches [skip ci]"
            git push
            echo "Committed and pushed updated satellite caches."
          else
            echo "No changes in src/data/ or public/cache/."
          fi
